name: Tests and lint

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, master]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.12', '3.13']
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping: 1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MCP_MONGO_MEMORY_TEST_CONNECTION: mongodb://127.0.0.1:27017/mongo_memory_test_ci
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.7'
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked pytest -q
